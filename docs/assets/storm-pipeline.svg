<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="872" viewBox="0 0 1200 872" role="img" aria-labelledby="title description">
  <title id="title">baike-storm：从标题到百科页面</title>
  <desc id="description">输入词条标题，依次完成视角发现、多视角调研、两段式大纲、分节生成、后处理和页面渲染。调研资料按 URL 去重并分配统一引用编号，供写作和配图复用。VLM 配图和 LLM 版面规划可选。输出 Markdown 报告、HTML 页面以及来源、大纲、对话、配图和信息栏文件。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#253c53" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#7c8c9f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="source-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#708e95" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
      .heading { font-size: 25px; font-weight: 650; fill: #172c43; }
      .detail { font-size: 18px; fill: #53677d; }
      .number { font-size: 15px; font-weight: 650; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .connector { fill: none; stroke: #7c8c9f; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arrow); }
      .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="870" rx="24" fill="url(#background)" stroke="#dfe8ec"/>
  <text x="48" y="51" font-size="14" font-weight="600" letter-spacing="2" fill="#64788d">BAIKE-STORM / PIPELINE</text>
  <text x="48" y="95" font-size="32" font-weight="650" fill="#172c43">从标题到百科页面</text>
  <text x="48" y="127" font-size="18" fill="#64788d">多视角检索调研 · 分节写作 · 可追溯引用</text>
  <rect x="48" y="157" width="340" height="42" rx="12" fill="#e9eef8" stroke="#d6dff0"/>
  <text x="68" y="184" font-size="16" fill="#536c93">输入</text>
  <path d="M116 169V187" stroke="#c5d0e4"/>
  <text x="134" y="184" font-size="17" font-weight="550" fill="#2e4c7a">词条标题，例如“问界M9”</text>
  <path d="M218 202V220" class="connector"/>

  <path d="M394 316H422" class="connector"/>
  <path d="M776 316H804" class="connector"/>
  <path d="M982 410V492" class="connector"/>
  <path d="M806 588H778" class="connector"/>
  <path d="M424 588H396" class="connector"/>
  <path d="M218 684V724" class="connector"/>

  <g transform="translate(48 228)">
    <rect width="340" height="176" rx="17" fill="#fff" stroke="#dce4f0" filter="url(#shadow)"/>
    <rect x="22" y="20" width="38" height="28" rx="8" fill="#eef1fc"/>
    <text x="41" y="40" text-anchor="middle" class="number" fill="#576fbb">01</text>
    <g transform="translate(288 22)" class="icon" stroke="#6c7dc0">
      <circle cx="16" cy="6" r="4"/>
      <circle cx="5" cy="24" r="4"/>
      <circle cx="27" cy="24" r="4"/>
      <path d="M14 10L7 20M18 10L25 20M10 24H22"/>
    </g>
    <text x="22" y="82" class="heading">视角发现</text>
    <text x="22" y="115" class="detail">基础事实 + 近期动态（可选）</text>
    <text x="22" y="144" class="detail">补充互不重复的调研视角</text>
  </g>

  <g transform="translate(430 228)">
    <rect width="340" height="176" rx="17" fill="#fff" stroke="#dce4f0" filter="url(#shadow)"/>
    <rect x="22" y="20" width="38" height="28" rx="8" fill="#eef1fc"/>
    <text x="41" y="40" text-anchor="middle" class="number" fill="#576fbb">02</text>
    <g transform="translate(286 20)" class="icon" stroke="#6c7dc0">
      <path d="M2 3H25V19H12L6 24V19H2ZM13 23V28H27L32 32V12H29M8 9H19M8 13H16"/>
    </g>
    <text x="22" y="82" class="heading">多视角调研</text>
    <text x="22" y="115" class="detail">Writer 提问 ↔ Expert 检索作答</text>
    <text x="22" y="144" class="detail">每个视角最多 M 轮</text>
  </g>

  <g transform="translate(812 228)">
    <rect width="340" height="176" rx="17" fill="#fff" stroke="#dce4f0" filter="url(#shadow)"/>
    <rect x="22" y="20" width="38" height="28" rx="8" fill="#eef1fc"/>
    <text x="41" y="40" text-anchor="middle" class="number" fill="#576fbb">03</text>
    <g transform="translate(288 22)" class="icon" stroke="#6c7dc0">
      <path d="M3 5H28M3 14H10M15 14H28M3 23H10M15 23H28M6 14V23"/>
    </g>
    <text x="22" y="82" class="heading">两段式大纲</text>
    <text x="22" y="115" class="detail">草拟 → 结合调研内容精修</text>
    <text x="22" y="144" class="detail">章节超限时自动合并</text>
  </g>

  <path d="M600 410V427" fill="none" stroke="#708e95" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#source-arrow)"/>
  <rect x="48" y="432" width="722" height="42" rx="11" fill="#e7f0f2" stroke="#d4e3e6"/>
  <g transform="translate(67 442)" class="icon" stroke="#5a7b85">
    <ellipse cx="10" cy="4" rx="9" ry="3"/>
    <path d="M1 4V18C1 22 19 22 19 18V4M1 11C1 15 19 15 19 11"/>
  </g>
  <text x="104" y="459" font-size="17" font-weight="600" fill="#3d6470">全局源库</text>
  <text x="190" y="459" font-size="15" class="mono" fill="#557b85">SourceLib</text>
  <path d="M291 444V462" stroke="#bdcfd5"/>
  <text x="313" y="459" font-size="16" fill="#557b85">URL 去重 · 统一 [n] 编号 · 写作与配图复用</text>
  <path d="M778 453H964" fill="none" stroke="#708e95" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#source-arrow)"/>

  <g transform="translate(812 500)">
    <rect width="340" height="176" rx="17" fill="#fff" stroke="#d6e7e4" filter="url(#shadow)"/>
    <rect x="22" y="20" width="38" height="28" rx="8" fill="#e9f4f1"/>
    <text x="41" y="40" text-anchor="middle" class="number" fill="#3c8274">04</text>
    <g transform="translate(288 20)" class="icon" stroke="#4d9586">
      <path d="M4 2H20L28 10V31H4ZM20 2V10H28M10 16H22M10 22H22M10 27H18"/>
    </g>
    <text x="22" y="82" class="heading">分节生成</text>
    <text x="22" y="115" class="detail">按章召回来源 · 带引用写作</text>
    <text x="22" y="144" class="detail">全文去重 · 导语 · 参考资料</text>
  </g>

  <g transform="translate(430 500)">
    <rect width="340" height="176" rx="17" fill="#fff" stroke="#d6e7e4" filter="url(#shadow)"/>
    <rect x="22" y="20" width="38" height="28" rx="8" fill="#e9f4f1"/>
    <text x="41" y="40" text-anchor="middle" class="number" fill="#3c8274">05</text>
    <g transform="translate(288 21)" class="icon" stroke="#4d9586">
      <rect x="2" y="3" width="28" height="25" rx="3"/>
      <path d="M19 3V28M7 9H14M7 15H14M7 21H12M22 21L25 15L28 21"/>
    </g>
    <text x="22" y="82" class="heading">后处理</text>
    <text x="22" y="115" class="detail">信息栏 · VLM 配图（可选）</text>
    <text x="22" y="144" class="detail">LLM 版面规划（可选）</text>
  </g>

  <g transform="translate(48 500)">
    <rect width="340" height="176" rx="17" fill="#fff" stroke="#d6e7e4" filter="url(#shadow)"/>
    <rect x="22" y="20" width="38" height="28" rx="8" fill="#e9f4f1"/>
    <text x="41" y="40" text-anchor="middle" class="number" fill="#3c8274">06</text>
    <g transform="translate(287 21)" class="icon" stroke="#4d9586">
      <rect x="2" y="3" width="30" height="26" rx="3"/>
      <path d="M2 11H32M7 7H8M12 7H13M8 17H19M8 22H19M24 16V24"/>
    </g>
    <text x="22" y="82" class="heading">页面渲染</text>
    <text x="22" y="115" class="detail">正文 + 信息栏 + 配图</text>
    <text x="22" y="144" class="detail">生成可直接打开的 HTML</text>
  </g>

  <rect x="48" y="732" width="1104" height="99" rx="16" fill="#f9fcfb" stroke="#d6e7e4"/>
  <text x="72" y="771" font-size="19" font-weight="600" fill="#2e675d">输出</text>
  <text x="158" y="771" font-size="19" class="mono" font-weight="600" fill="#27435b">final_report.md</text>
  <text x="353" y="771" font-size="16" fill="#64788d">Markdown 报告</text>
  <path d="M503 749V778" stroke="#d8e4e2"/>
  <text x="529" y="771" font-size="19" class="mono" font-weight="600" fill="#27435b">index.html</text>
  <text x="664" y="771" font-size="16" fill="#64788d">百科页面</text>
  <text x="158" y="807" font-size="14" class="mono" fill="#64788d">sources.json · outline.md · conversations.md · figures.json · infobox.json</text>
</svg>
